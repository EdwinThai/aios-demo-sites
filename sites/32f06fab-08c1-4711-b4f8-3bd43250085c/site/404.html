<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte — Studio Mikaela</title>
  <meta name="description" content="Sidan du letade efter finns inte. Gå tillbaka till Studio Mikaelas startsida.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background-color: #F5F3EE;
      color: #2C2C28;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .site-header {
      background: rgba(245, 243, 238, 0.97);
      border-bottom: 1px solid rgba(107, 158, 107, 0.15);
      padding: 1rem 2rem;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
    }
    .logo-img {
      max-height: 44px;
      width: auto;
      display: block;
    }

    /* MAIN */
    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem;
    }
    .error-content {
      text-align: center;
      max-width: 520px;
    }
    .error-leaf {
      width: 90px;
      height: 90px;
      margin: 0 auto 2rem;
    }
    .error-404 {
      font-family: Georgia, "Iowan Old Style", "Book Antiqua", Palatino, serif;
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1;
      color: #6B9E6B;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
      opacity: 0.3;
    }
    .error-content h1 {
      font-family: Georgia, "Iowan Old Style", "Book Antiqua", Palatino, serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .error-content p {
      color: #6a6a64;
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
      max-width: 44ch;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.85rem 2rem;
      border-radius: 3rem;
      background: #6B9E6B;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: all 0.22s ease;
      border: 2px solid #6B9E6B;
    }
    .btn-home:hover {
      background: #4e7a4e;
      border-color: #4e7a4e;
      box-shadow: 0 6px 20px rgba(107, 158, 107, 0.35);
      transform: translateY(-2px);
    }

    /* FOOTER */
    .site-footer {
      background: #2C2C28;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    .site-footer p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-inner">
      <a href="index.html">
        <img src="logo.jpg" alt="Studio Mikaela" class="logo-img">
      </a>
    </nav>
  </header>

  <main class="error-main">
    <div class="error-content">
      <svg class="error-leaf" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M45 8 C28 8 18 26 28 46 C33 57 40 64 45 72 C50 64 57 57 62 46 C72 26 62 8 45 8 Z" fill="#6B9E6B" opacity="0.25"/>
        <line x1="45" y1="52" x2="45" y2="72" stroke="#6B9E6B" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
      </svg>
      <div class="error-404" aria-hidden="true">404</div>
      <h1>Oj, den här sidan verkar ha gömt sig.</h1>
      <p>Sidan du letade efter finns tyvärr inte — kanske en gammal länk, kanske ett litet stavfel. Inga problem, vi hjälper dig tillbaka!</p>
      <a href="index.html" class="btn-home">
        ← Tillbaka till startsidan
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Studio Mikaela, Skövde. Alla rättigheter förbehållna.</p>
  </footer>

</body>
</html>
