<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Ellesse</title>
  <meta name="description" content="Den här sidan finns inte. Gå tillbaka till Ellesse startsida.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --col-bg:      #D8D8C0;
      --col-surface: #F5F0E8;
      --col-accent:  #C8A898;
      --col-accent-dk: #A8806E;
      --col-text:    #303030;
      --col-text-sub: #7A7A6E;
      --font-head: Georgia, "Iowan Old Style", Palatino, serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    html, body { height: 100%; }
    body {
      background-color: var(--col-bg);
      color: var(--col-text);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .logo-wrap { margin-bottom: 3rem; }
    .logo-wrap img { max-height: 44px; width: auto; }
    .error-card {
      background: var(--col-surface);
      border-radius: 20px;
      padding: 3.5rem 3rem;
      max-width: 480px;
      box-shadow: 0 4px 32px rgba(48,48,48,0.10);
    }
    .error-num {
      font-family: var(--font-head);
      font-size: clamp(4rem, 12vw, 7rem);
      color: var(--col-accent);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: var(--font-head);
      font-size: 1.6rem;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--col-text-sub);
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      background-color: var(--col-accent);
      color: var(--col-surface);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color 200ms ease-out, box-shadow 200ms ease-out;
    }
    .btn:hover {
      background-color: var(--col-accent-dk);
      box-shadow: 0 6px 24px rgba(200,168,152,0.35);
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <a href="index.html">
      <img src="logo.jpg" alt="Ellesse">
    </a>
  </div>
  <div class="error-card">
    <div class="error-num">404</div>
    <h1>Den här sidan finns inte</h1>
    <p>Det verkar som att du hamnat lite fel. Inget att oroa sig för – det händer den bäste. Klicka nedan så tar vi dig tillbaka.</p>
    <a href="index.html" class="btn">Tillbaka till startsidan</a>
  </div>
</body>
</html>
