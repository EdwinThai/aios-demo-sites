<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Ellesse</title>
  <meta name="description" content="Sidan du letar efter finns inte. Gå tillbaka till Ellesse.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg:      #D8D8C0;
      --bg-warm: #F5F0E8;
      --accent:  #C8A898;
      --accent-dk: #b0897a;
      --text:    #303030;
      --text-sub:#7A7A6E;
      --font-heading: Georgia, "Iowan Old Style", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid rgba(200,168,152,0.25);
      background: rgba(216,216,192,0.9);
    }

    .logo-link img {
      max-height: 44px;
      width: auto;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 2rem;
    }

    .four-oh-four {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 18vw, 11rem);
      line-height: 1;
      color: var(--accent);
      opacity: 0.55;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: var(--text);
    }

    p {
      color: var(--text-sub);
      font-size: 1.0625rem;
      line-height: 1.7;
      max-width: 42ch;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.875rem 2rem;
      border-radius: 100px;
      cursor: pointer;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      transition: background 220ms cubic-bezier(0.16,1,0.3,1),
                  border-color 220ms cubic-bezier(0.16,1,0.3,1),
                  transform 220ms cubic-bezier(0.16,1,0.3,1);
    }

    .btn:hover {
      background: var(--accent-dk);
      border-color: var(--accent-dk);
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: 0.8rem;
      color: var(--text-sub);
      border-top: 1px solid rgba(48,48,48,0.08);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-link">
      <img src="logo.jpg" alt="Ellesse">
    </a>
  </header>

  <main>
    <div class="four-oh-four" aria-hidden="true">404</div>
    <h1>Den här sidan finns inte</h1>
    <p>Det verkar som att länken du följde inte leder någonstans. Kanske stavades adressen fel, eller så har sidan tagits bort.</p>
    <a href="index.html" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Tillbaka till startsidan
    </a>
  </main>

  <footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script> Ellesse, Ulricehamn &mdash; Storgatan 15, 523 30 Ulricehamn</p>
  </footer>

</body>
</html>
