<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Ellesse</title>
  <meta name="description" content="Sidan du söker finns inte. Gå tillbaka till Ellesse frisörsalong i Ulricehamn.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --color-bg: #D8D8C0;
      --color-surface: #F5F0E8;
      --color-accent: #C8A898;
      --color-accent-dark: #a8806e;
      --color-text: #303030;
      --color-text-muted: #7A7A6E;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(216, 216, 192, 0.9);
      border-bottom: 1px solid rgba(200, 168, 152, 0.2);
      padding: 0.75rem 1.5rem;
    }

    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
    }

    .site-logo {
      max-height: 44px;
      width: auto;
      display: block;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
    }

    .error-box {
      background-color: var(--color-surface);
      border-radius: 1.5rem;
      padding: 4rem 3rem;
      max-width: 540px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(48, 48, 48, 0.08);
    }

    .error-icon {
      margin: 0 auto 1.5rem;
      color: var(--color-accent);
    }

    .error-code {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 400;
      color: var(--color-accent);
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 400;
      color: var(--color-text);
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    p {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--color-text-muted);
      margin-bottom: 2rem;
      max-width: 44ch;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      border: 2px solid var(--color-accent);
      background-color: var(--color-accent);
      color: var(--color-surface);
      text-decoration: none;
      cursor: pointer;
      transition:
        background-color 200ms cubic-bezier(0.16, 1, 0.3, 1),
        border-color 200ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background-color: var(--color-accent-dark);
      border-color: var(--color-accent-dark);
      box-shadow: 0 8px 28px rgba(200, 168, 152, 0.3);
      transform: translateY(-2px);
    }

    footer {
      background-color: #222220;
      padding: 1.5rem;
      text-align: center;
    }

    footer p {
      font-size: 0.75rem;
      color: rgba(245, 240, 232, 0.3);
      margin: 0;
      max-width: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html">
        <img src="logo.jpg" alt="Ellesse" class="site-logo">
      </a>
    </div>
  </header>

  <main>
    <div class="error-box">
      <svg class="error-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C8A898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4"/>
        <path d="M12 16h.01"/>
      </svg>
      <p class="error-code">404</p>
      <h1>Den här sidan finns inte</h1>
      <p>Det vi letar efter verkar ha klippts bort. Gå tillbaka till startsidan så hjälper vi dig vidare.</p>
      <a href="index.html" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Tillbaka till startsidan
      </a>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Ellesse, Ulricehamn</p>
  </footer>
</body>
</html>
