<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Ellesse Ulricehamn</title>
  <meta name="description" content="Sidan du letade efter finns inte. Gå tillbaka till Ellesses startsida.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #D8D8C0;
      color: #303030;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: rgba(216, 216, 192, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200, 168, 152, 0.25);
      padding: 0 2rem;
      height: 68px;
      display: flex;
      align-items: center;
    }
    .logo-img {
      max-height: 44px;
      width: auto;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }

    .not-found-inner {
      max-width: 520px;
    }

    .label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #C8A898;
      margin-bottom: 1rem;
      display: block;
    }

    .title {
      font-family: Georgia, "Iowan Old Style", "Book Antiqua", Palatino, serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }

    .lead {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #7A7A6E;
      margin-bottom: 2.5rem;
      max-width: 44ch;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #C8A898;
      color: #fff;
      border: 2px solid #C8A898;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 12px rgba(200, 168, 152, 0.35);
    }

    .btn:hover, .btn:focus-visible {
      background: #A8887A;
      border-color: #A8887A;
      box-shadow: 0 6px 24px rgba(168, 136, 122, 0.45);
      transform: translateY(-2px);
    }

    .deco {
      font-family: Georgia, serif;
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 700;
      color: rgba(200, 168, 152, 0.18);
      line-height: 1;
      margin-bottom: 1.5rem;
      user-select: none;
      letter-spacing: -0.04em;
    }

    /* Footer */
    .footer {
      background: #303030;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    .footer p {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
    }
    .footer a {
      color: #C8A898;
      text-decoration: underline;
    }
    .footer a:hover { color: #fff; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html">
      <img src="logo.jpg" alt="Ellesse" class="logo-img">
    </a>
  </header>

  <main class="main">
    <div class="not-found-inner">
      <div class="deco" aria-hidden="true">404</div>
      <span class="label">Sidan hittades inte</span>
      <h1 class="title">Hm, det här stämmer inte.</h1>
      <p class="lead">Sidan du letade efter verkar inte finnas. Det händer – gå tillbaka till startsidan så hjälper vi dig vidare.</p>
      <a href="index.html" class="btn">← Tillbaka till Ellesse</a>
    </div>
  </main>

  <footer class="footer">
    <p>
      <!--FIELD:company_name-->Ellesse<!--/FIELD:company_name--> &nbsp;·&nbsp;
      <!--FIELD:address-->Storgatan 15, Ulricehamn<!--/FIELD:address--> &nbsp;·&nbsp;
      <!--FIELD:phone--><a href="tel:0321-12377">0321-123 77</a><!--/FIELD:phone-->
    </p>
  </footer>

</body>
</html>
