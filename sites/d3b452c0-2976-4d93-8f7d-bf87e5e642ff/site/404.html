<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Ellesse</title>
  <meta name="description" content="Sidan du letar efter finns inte. Gå tillbaka till Ellesse frisörsalong i Ulricehamn.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg:     #EAE9D8;
      --bg-alt: #F5F0E8;
      --accent: #C8A898;
      --text:   #303030;
      --muted:  #7A7A6E;
      --ff-h: Georgia, "Iowan Old Style", serif;
      --ff-b: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--ff-b);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid rgba(200,168,152,0.25);
      background: rgba(234,233,216,0.95);
    }
    header a { display: inline-block; }
    header img { max-height: 40px; width: auto; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 1.5rem;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: var(--ff-h);
      font-size: 5rem;
      font-weight: 400;
      width: 140px;
      height: 140px;
      line-height: 140px;
      border-radius: 50%;
      margin-bottom: 2.5rem;
    }
    h1 {
      font-family: var(--ff-h);
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 48ch;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 2rem;
      background: var(--accent);
      color: #fff;
      font-family: var(--ff-b);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1);
    }
    .btn:hover {
      background: #A8897A;
      transform: translateY(-1px);
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid rgba(200,168,152,0.2);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="logo.jpg" alt="Ellesse"></a>
  </header>
  <main>
    <div class="badge" aria-hidden="true">404</div>
    <h1>Den här sidan finns inte</h1>
    <p>Det kan hända att länken har ändrats eller att adressen är felstavad. Inget att oroa sig för – du hittar allt du behöver på vår startsida.</p>
    <a href="index.html" class="btn">Tillbaka till startsidan</a>
  </main>
  <footer>
    &copy; 2025 Ellesse, Ulricehamn &nbsp;&middot;&nbsp; Storgatan 15, 523 30 Ulricehamn
  </footer>
</body>
</html>
