<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidan hittades inte — Pretty Hair Sundsvall</title>
<meta name="description" content="Sidan du sökte finns inte längre hos Pretty Hair Sundsvall.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
(function(){
  try {
    var t = localStorage.getItem('ph-theme');
    if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); }
  } catch(e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
    background: var(--paper);
  }
  .error-page .eyebrow { color: var(--accent-dark); }
  .error-page h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 0.4rem; }
  .error-page p { max-width: 46ch; color: var(--ink-faint); }
  .error-code { font-family: 'Fraunces', serif; font-size: 5rem; color: var(--rose); font-weight: 600; margin-bottom: 0; }
</style>
</head>
<body>
<div class="error-page">
  <p class="error-code">404</p>
  <p class="eyebrow">Oj då</p>
  <h1>Den här sidan klipptes visst bort</h1>
  <p>Vi kunde inte hitta sidan du letade efter. Kanske länken är gammal, eller så skrevs adressen fel — men salongen finns kvar precis där den ska.</p>
  <a class="btn btn-primary" href="index.html" style="margin-top:2rem;">Tillbaka till startsidan</a>
</div>
</body>
</html>
