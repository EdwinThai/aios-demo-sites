<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Salong ReHot</title>
  <meta name="description" content="Sidan du sökte hittades tyvärr inte. Gå tillbaka till Salong ReHots startsida.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #FAF6F1;
      color: #2C1F1A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(250,246,241,0.95);
      border-bottom: 1px solid #EDD5CC;
      padding: 1rem 2rem;
    }
    header img {
      max-height: 44px;
      width: auto;
      display: block;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem;
      position: relative;
      overflow: hidden;
    }
    .deco {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,137,122,0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .error-num {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 700;
      color: #EDD5CC;
      line-height: 1;
      margin-bottom: 1.5rem;
      position: relative;
    }
    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      color: #2C1F1A;
      margin-bottom: 1rem;
      position: relative;
    }
    p {
      color: #7a5a52;
      line-height: 1.7;
      max-width: 42ch;
      margin: 0 auto 2.5rem;
      position: relative;
    }
    .btn {
      display: inline-block;
      background: #C9897A;
      color: #fff;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition: background 200ms ease, box-shadow 200ms ease, transform 150ms ease;
      position: relative;
    }
    .btn:hover {
      background: #a8614f;
      box-shadow: 0 4px 18px rgba(201,137,122,0.35);
      transform: translateY(-2px);
    }
    footer {
      background: #2C1F1A;
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">
      <img src="logo.jpg" alt="Salong ReHot">
    </a>
  </header>

  <main>
    <div class="deco"></div>
    <div class="error-num">404</div>
    <h1>Hoppsan — sidan hittades inte</h1>
    <p>Det verkar som att sidan du söker har flyttats eller inte finns längre. Men vi är fortfarande här — välkommen tillbaka till startsidan!</p>
    <a href="index.html" class="btn">Gå till startsidan</a>
  </main>

  <footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script> Salong ReHot, Skövde. Alla rättigheter förbehållna.</p>
  </footer>
</body>
</html>
