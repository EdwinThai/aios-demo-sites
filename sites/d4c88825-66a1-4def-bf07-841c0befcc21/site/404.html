<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Salladshuset</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #181818;
      color: #F5F0E8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(24,24,24,0.95);
      border-bottom: 1px solid rgba(74,103,65,0.25);
      padding: 1rem 5%;
      display: flex;
      align-items: center;
    }
    header img {
      max-height: 44px;
      width: auto;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 5%;
    }
    .big-num {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      color: #4A6741;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: #F5F0E8;
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 1rem;
      color: rgba(245,240,232,0.7);
      line-height: 1.7;
      max-width: 46ch;
      margin: 0 auto 2.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      background: #4A6741;
      color: #F5F0E8;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 200ms ease, box-shadow 200ms ease, transform 150ms ease;
      border: 2px solid #4A6741;
    }
    .btn:hover {
      background: #3a5432;
      box-shadow: 0 0 20px rgba(74,103,65,0.45);
      transform: translateY(-2px);
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.78rem;
      color: rgba(245,240,232,0.3);
      border-top: 1px solid rgba(245,240,232,0.08);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">
      <img src="logo.jpg" alt="Salladshuset">
    </a>
  </header>
  <main>
    <div class="big-num" aria-hidden="true">404</div>
    <h1>Den här sidan finns inte</h1>
    <p>Det verkar som att du hittat en tom tallrik. Sidan du söker har flyttat eller tagits bort – men kvällen är fortfarande ung.</p>
    <a href="index.html" class="btn">Tillbaka till startsidan</a>
  </main>
  <footer>
    <p>&copy; 2025 Salladshuset i Linköping AB</p>
  </footer>
</body>
</html>
